<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#E3051B">
  <title>WRC Sauna MM uuendamine</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e0e0f;color:#f0f0f0;font-family:system-ui,sans-serif;text-align:center}
    main{padding:24px}.spinner{width:42px;height:42px;margin:0 auto 16px;border:4px solid #333;border-top-color:#e3051b;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body><main><div class="spinner"></div><strong>Uuendan WRC Sauna MM rakendust…</strong></main>
<script>
(async()=>{
  if('serviceWorker' in navigator){
    const registrations=await navigator.serviceWorker.getRegistrations();
    await Promise.all(registrations.map(registration=>registration.unregister()));
  }
  if('caches' in window){
    const keys=await caches.keys();
    await Promise.all(keys.map(key=>caches.delete(key)));
  }
  location.replace('/?updated=1');
})().catch(()=>location.replace('/?updated=1'));
</script></body></html>
